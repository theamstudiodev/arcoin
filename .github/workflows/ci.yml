name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    name: Migrations + access rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17        # same major version as new Supabase projects
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Script safety guards          # the database scripts refuse anything but a local database
        run: ./scripts/test-guards.sh
      - name: Apply migrations, seed, run access tests
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: ./scripts/test-db.sh

  app:
    name: App + engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test                      # engine specification (vitest)
      - run: npm run build -w apps/web     # also generates Next's type declarations
      - run: npm run typecheck
